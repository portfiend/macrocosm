# Ungu

- type: entity
  parent: BoxCardboard
  id: BoxSurvivalUngu
  name: survival box
  description: It's a box with basic internals inside. Smells like grass?
  suffix: Wheat
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskBreath
        - id: EmergencyOxygenTankFilled
        - id: EmergencyMedipen
        - id: Flare
        - id: WheatBushel
        - id: DrinkWaterBottleFull
  - type: Sprite
    sprite: _MACRO/Objects/Storage/boxes.rsi
    layers:
    - state: internals
    - state: emergencytankcommand

- type: entity
  parent: BoxSurvivalUngu
  id: BoxHugUngu
  name: box of hugs
  components:
  - type: Sprite
    sprite: Objects/Storage/boxes.rsi
    layers:
    - state: box_hug
    - state: heart
  - type: Item
    heldPrefix: hug
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskBreath
        - id: EmergencyFunnyOxygenTankFilled
        - id: EmergencyMedipen
        - id: Flare
        - id: WheatBushel
        - id: DrinkWaterBottleFull
  - type: Tag
    tags:
    - BoxHug

